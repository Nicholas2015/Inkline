name: macOS native package
on: [push, pull_request, workflow_dispatch]
jobs:
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install qtbase qt5compat qscintilla2 ninja
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qtbase);$(brew --prefix qt5compat);$(brew --prefix qscintilla2)"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          python3 tests/logworker.py build/Inkline.app/Contents/MacOS/Inkline
          python3 tests/search_worker.py build/Inkline.app/Contents/MacOS/Inkline
      - name: Package and verify
        run: |
          "$(brew --prefix qtbase)/bin/macdeployqt" build/Inkline.app -always-overwrite
          codesign --force --deep --sign - build/Inkline.app
          build/Inkline.app/Contents/MacOS/Inkline --verify-install "$RUNNER_TEMP/check.json"
          ditto -c -k --keepParent build/Inkline.app build/Inkline-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Inkline-macOS
          path: build/Inkline-macOS.zip
